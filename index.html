<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Aligned Timers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .timer-row {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .timer-label {
            font-size: 24px;
            font-weight: bold;
            width: 80px; /* Fixed width for all labels */
            text-align: right;
            padding-right: 10px;
        }
        
        .timer-display {
            font-size: 24px;
            font-family: monospace;
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 180px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .rainbow-glow {
            position: absolute;
            top: -4px;
            left: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            border-radius: 8px;
            z-index: 0;
            overflow: hidden;
            filter: blur(4px); /* Added motion blur effect */
        }
        
        .rainbow-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            right: -50%;
            bottom: 0;
            background: linear-gradient(90deg, 
                rgba(255, 182, 193, 0.7), /* Light pink */
                rgba(173, 216, 230, 0.7), /* Light blue */
                rgba(152, 251, 152, 0.7), /* Light green */
                rgba(238, 232, 170, 0.7), /* Light yellow */
                rgba(221, 160, 221, 0.7), /* Light purple */
                rgba(255, 182, 193, 0.7)  /* Light pink again to loop */
            );
            animation: rainbow-rotate 2s linear infinite; /* Faster animation */
            filter: blur(6px); /* Additional blur for more motion effect */
        }
        
        .gym-container {
            display: flex;
            gap: 10px;
        }
        
        .gym-box {
            font-size: 24px;
            font-family: monospace;
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        @keyframes rainbow-rotate {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(33.33%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-row">
            <div class="timer-label">za</div>
            <div id="timer1" class="timer-display">00:00:00</div>
        </div>
        
        <div class="timer-row">
            <div class="timer-label">nic</div>
            <div id="timer2" class="timer-display">00:00:00</div>
        </div>
        
        <div class="timer-row">
            <div class="timer-label">alc</div>
            <div id="timer3" class="timer-display">00:00:00</div>
        </div>
        
        <div class="timer-row">
            <div class="timer-label">gym</div>
            <div class="gym-container">
                <div id="weight" class="gym-box">138lb</div>
                <div id="workout-count" class="gym-box">10u+l</div>
                <div id="next-workout" class="gym-box">0h</div>
            </div>
        </div>
    </div>

    <script>
        // Set start times
        // za: April 30, 2025 at 12:16 AM CST
        const zaStartTime = new Date('2025-04-30T00:16:00-05:00');
        
        // nic: April 30, 2025 at 1 AM CST
        const nicStartTime = new Date('2025-04-30T01:00:00-05:00');
        
        // alc: April 14, 2025 at 4 PM CST
        const alcStartTime = new Date('2025-04-14T16:00:00-05:00');
        
        // Gym workout tracking
        let upperDays = 5;
        let lowerDays = 5;
        let lastWorkoutDate = new Date('2025-04-30'); // Today
        let workoutSchedule = ['upper', 'lower', 'rest']; // Upper, Lower, Rest cycle
        let currentWorkoutIndex = 0; // Start with upper (today)
        
        // Calculate seconds from start times
        function getElapsedSeconds(startTime) {
            const now = new Date();
            return (now - startTime) / 1000; // Return with decimal for millisecond precision
        }
        
        // Format seconds to DD:HH:MM:SS
        function formatTime(totalSeconds) {
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);
            
            return `${days}d:${hours.toString().padStart(2, '0')}h:${minutes.toString().padStart(2, '0')}m:${seconds.toString().padStart(2, '0')}s`;
        }
        
        // Calculate hours until next workout
        function getHoursUntilNextWorkout() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // If current workout is 'rest', next workout is 2 days away at 7 PM
            if (workoutSchedule[currentWorkoutIndex] === 'rest') {
                const nextWorkoutDay = new Date(today);
                
                // If it's before 7 PM, next workout is 2 days away at 7 PM
                if (now.getHours() < 19) {
                    nextWorkoutDay.setDate(nextWorkoutDay.getDate() + 2);
                    nextWorkoutDay.setHours(19, 0, 0, 0);
                } 
                // If it's after 7 PM, next workout is 3 days away at 7 PM
                else {
                    nextWorkoutDay.setDate(nextWorkoutDay.getDate() + 3);
                    nextWorkoutDay.setHours(19, 0, 0, 0);
                }
                
                return Math.ceil((nextWorkoutDay - now) / (1000 * 60 * 60));
            } 
            // If current workout is 'upper' or 'lower'
            else {
                // If it's before 7 PM today, next workout is at 7 PM today
                if (now.getHours() < 19) {
                    const nextWorkout = new Date(today);
                    nextWorkout.setHours(19, 0, 0, 0);
                    return Math.ceil((nextWorkout - now) / (1000 * 60 * 60));
                } 
                // If it's after 7 PM, next workout is at 7 PM tomorrow
                else {
                    const tomorrow = new Date(today);
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    tomorrow.setHours(19, 0, 0, 0);
                    return Math.ceil((tomorrow - now) / (1000 * 60 * 60));
                }
            }
        }
        
        // Update gym workout counts
        function updateGymCounts() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const lastWorkoutDay = new Date(lastWorkoutDate.getFullYear(), lastWorkoutDate.getMonth(), lastWorkoutDate.getDate());
            
            // If it's a new day AND past 7PM, update the workout cycle
            if (today > lastWorkoutDay && now.getHours() >= 19) {
                // Advance to next workout in schedule
                currentWorkoutIndex = (currentWorkoutIndex + 1) % workoutSchedule.length;
                const todaysWorkout = workoutSchedule[currentWorkoutIndex];
                
                // Increment the appropriate counter
                if (todaysWorkout === 'upper') {
                    upperDays++;
                } else if (todaysWorkout === 'lower') {
                    lowerDays++;
                }
                
                // Update the last workout date
                lastWorkoutDate = new Date(today);
            }
            
            // Total workout count
            const totalWorkouts = upperDays + lowerDays;
            
            // Calculate hours until next workout
            const hoursUntilNext = getHoursUntilNextWorkout();
            
            // Update the displays
            document.getElementById('workout-count').textContent = `${totalWorkouts}u+l`;
            document.getElementById('next-workout').textContent = `${hoursUntilNext}h`;
        }
        
        // Find the highest timer value
        function updateHighestTimer() {
            const zaSeconds = getElapsedSeconds(zaStartTime);
            const nicSeconds = getElapsedSeconds(nicStartTime);
            const alcSeconds = getElapsedSeconds(alcStartTime);
            
            // Remove rainbow effect from all
            document.querySelectorAll('.rainbow-glow').forEach(el => el.remove());
            
            // Find highest timer
            const highest = Math.max(zaSeconds, nicSeconds, alcSeconds);
            let highestElement;
            
            if (highest === zaSeconds) {
                highestElement = document.querySelector('.timer-row:nth-child(1) .timer-display');
            } else if (highest === nicSeconds) {
                highestElement = document.querySelector('.timer-row:nth-child(2) .timer-display');
            } else {
                highestElement = document.querySelector('.timer-row:nth-child(3) .timer-display');
            }
            
            // Add rainbow effect to highest
            const rainbowEffect = document.createElement('div');
            rainbowEffect.className = 'rainbow-glow';
            highestElement.parentNode.appendChild(rainbowEffect);
            
            // Position the rainbow effect properly around the timer display
            const timerRect = highestElement.getBoundingClientRect();
            const parentRect = highestElement.parentNode.getBoundingClientRect();
            
            rainbowEffect.style.left = (highestElement.offsetLeft - 4) + 'px';
            rainbowEffect.style.top = (highestElement.offsetTop - 4) + 'px';
            rainbowEffect.style.width = (highestElement.offsetWidth + 8) + 'px';
            rainbowEffect.style.height = (highestElement.offsetHeight + 8) + 'px';
        }
        
        // Initial update
        document.getElementById('timer1').textContent = formatTime(getElapsedSeconds(zaStartTime));
        document.getElementById('timer2').textContent = formatTime(getElapsedSeconds(nicStartTime));
        document.getElementById('timer3').textContent = formatTime(getElapsedSeconds(alcStartTime));
        updateGymCounts();
        updateHighestTimer();
        
        // Update timers every 16ms (approx 60fps) for smooth millisecond updates
        setInterval(() => {
            document.getElementById('timer1').textContent = formatTime(getElapsedSeconds(zaStartTime));
            document.getElementById('timer2').textContent = formatTime(getElapsedSeconds(nicStartTime));
            document.getElementById('timer3').textContent = formatTime(getElapsedSeconds(alcStartTime));
            updateGymCounts();
            updateHighestTimer();
        }, 16);
    </script>
</body>
</html>
